sentence=Kalibrasi sensor berbahasa Indonesia: ubah bacaan mentah menjadi nilai nyata lewat tabel titik ukur.
paragraph=Interpolasi linear antar titik untuk sensor tidak linear (persen baterai Li-ion, Sharp IR, termistor, kelembapan tanah) dan kalibrasi dua titik untuk sensor linear. Tabel boleh naik atau turun, diperiksa otomatis (mulai() bernilai false jika tidak urut), dibatasi di luar rentang atau diekstrapolasi, dan bisa disimpan di flash (PROGMEM) di AVR. Tanpa salinan tabel, tanpa alokasi dinamis. English: sensor calibration, lookup table, piecewise linear interpolation, multimap, two point calibration, battery percentage, Sharp IR distance.
